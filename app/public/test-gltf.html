<!DOCTYPE html>
<html>
<head>
    <title>GLTF Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="container" style="width: 400px; height: 400px; border: 1px solid #ccc;"></div>
    <div id="status">Loading...</div>
    
    <script>
        console.log('Starting GLTF test...');
        
        // 创建场景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(400, 400);
        document.getElementById('container').appendChild(renderer.domElement);
        
        // 添加光源
        const light = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(light);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
        
        // 设置相机位置
        camera.position.z = 5;
        
        // 加载GLTF文件
        const loader = new THREE.GLTFLoader();
        const modelUrl = '/魔法石单音箱集合.gltf';
        
        console.log('Attempting to load:', modelUrl);
        document.getElementById('status').textContent = 'Loading GLTF...';
        
        loader.load(
            modelUrl,
            function(gltf) {
                console.log('GLTF loaded successfully!', gltf);
                document.getElementById('status').textContent = 'GLTF loaded successfully!';
                
                // 添加模型到场景
                scene.add(gltf.scene);
                
                // 调整模型大小和位置
                const box = new THREE.Box3().setFromObject(gltf.scene);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                gltf.scene.position.sub(center);
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 3 / maxDim;
                    gltf.scene.scale.setScalar(scale);
                }
                
                console.log('Model added to scene');
            },
            function(progress) {
                console.log('Loading progress:', (progress.loaded / progress.total * 100) + '% loaded');
            },
            function(error) {
                console.error('Error loading GLTF:', error);
                document.getElementById('status').textContent = 'Error loading GLTF: ' + error.message;
            }
        );
        
        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        console.log('Test setup complete');
    </script>
</body>
</html>
